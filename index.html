.reveal{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .6s ease,transform .6s ease
}

.reveal.is-visible{
  opacity:1;
  transform:none
}

.pop-card{
  opacity:0;
  transform:translateY(14px) scale(.92);
  transition:opacity 550ms cubic-bezier(.22,1,.36,1),transform 550ms cubic-bezier(.22,1,.36,1),box-shadow 550ms cubic-bezier(.22,1,.36,1)
}

.pop-card.is-visible{
  opacity:1;
  transform:translateY(0) scale(1)
}

.pop-card.is-visible:hover{
  transform:translateY(0) scale(1.02)
}

.menu-icon{
  position:relative;
  display:block;
  width:24px;
  height:24px
}

.menu-line{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  border-radius:2px;
  background:currentColor;
  transform-origin:center;
  transition:transform 300ms ease,opacity 300ms ease,top 300ms ease
}

.menu-line:nth-child(1){
  top:5px
}

.menu-line:nth-child(2){
  top:11px
}

.menu-line:nth-child(3){
  top:17px
}

.menu-open .menu-line:nth-child(1){
  top:11px;
  transform:rotate(45deg)
}

.menu-open .menu-line:nth-child(2){
  opacity:0;
  transform:scaleX(.2)
}

.menu-open .menu-line:nth-child(3){
  top:11px;
  transform:rotate(-45deg)
}

.mobile-menu{
  overflow:hidden;
  transition:max-height 300ms ease,opacity 300ms ease,transform 300ms ease,visibility 300ms ease
}

.mobile-menu.is-closed{
  max-height:0;
  opacity:0;
  transform:translateY(-8px);
  visibility:hidden;
  pointer-events:none;
  border-top-color:transparent
}

.mobile-menu.is-open{
  max-height:480px;
  opacity:1;
  transform:translateY(0);
  visibility:visible;
  pointer-events:auto
}

@media (prefers-reduced-motion: reduce){
  html{
    scroll-behavior:auto
  }

  .reveal{
    opacity:1;
    transform:none;
    transition:none
  }

  .pop-card{
    opacity:1;
    transform:none;
    transition:none
  }

  .pop-card.is-visible:hover{
    transform:none
  }

  .menu-line{
    transition:none
  }

  .mobile-menu{
    transition:none
  }
}
